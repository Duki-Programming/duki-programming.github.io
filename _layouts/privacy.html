<!doctype html>
<html lang="{{ page.lang | default: 'ko' | escape }}">
{% assign copy = site.data.privacy[page.lang] %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include site-fonts.html %}
  <title>{{ copy.title | escape }} — Duki Lab</title>
  <meta name="description" content="{{ copy.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="ko" href="{{ '/privacy/' | absolute_url }}">
  <link rel="alternate" hreflang="en" href="{{ '/privacy/en/' | absolute_url }}">
  <link rel="alternate" hreflang="ja" href="{{ '/privacy/ja/' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/brand.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/catalog.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/business-footer.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/privacy.css' | relative_url }}">
  {% include google-site-verification.html %}
  <link rel="stylesheet" href="{{ '/assets/css/languages.css' | relative_url }}">
</head>
<body>
  <header class="catalog-header shell">
    <a class="catalog-brand" href="{{ site.data.ui[page.lang].home_url | relative_url }}"><img src="{{ '/assets/brand.svg' | relative_url }}" width="32" height="32" alt="">Duki Lab<span aria-hidden="true">.</span></a>
    {% include language-switch.html class="company-language" %}
  </header>
  {{ content }}
  <footer class="catalog-footer shell business-footer">{% include business-footer.html %}</footer>
</body>
</html>
