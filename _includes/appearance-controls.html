<div class="site-appearance">
  {% include language-switch.html class=include.class %}
  {% assign theme_copy = site.data.ui[page.lang] | default: site.data.ui.ko %}
  <button class="site-theme-toggle" type="button" role="switch" aria-label="{{ theme_copy.dark_mode | escape }}" aria-checked="{% if page.product == 'btcoffice' %}false{% else %}true{% endif %}" data-light-title="{{ theme_copy.switch_light | escape }}" data-dark-title="{{ theme_copy.switch_dark | escape }}" hidden>
    <span class="site-theme-thumb" aria-hidden="true"></span>
    <span class="site-theme-icon site-theme-sun" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
    <span class="site-theme-icon site-theme-moon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 14.8A8.8 8.8 0 0 1 9.2 3.2a9.3 9.3 0 1 0 11.6 11.6Z"></path></svg></span>
  </button>
</div>
