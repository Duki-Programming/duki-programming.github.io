{% assign likes_api = site.data.likes.api_url | default: '' | strip %}
{% if likes_api != '' %}
<div class="download-likes" data-likes-api="{{ likes_api | escape }}" data-likes-waiting="{{ copy.likes.waiting | escape }}" data-likes-ready="{{ copy.likes.ready | escape }}" data-likes-thanks="{{ copy.likes.thanks | escape }}" data-likes-error="{{ copy.likes.error | escape }}" data-likes-label="{{ copy.likes.action | escape }}" data-likes-done="{{ copy.likes.done | escape }}">
  <div class="download-likes-copy"><strong>{{ copy.likes.title | escape }}</strong><p data-likes-status role="status" aria-live="polite">{{ copy.likes.loading | escape }}</p></div>
  <button class="like-button" type="button" aria-label="{{ copy.likes.action | escape }}" aria-pressed="false" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>
    <span data-likes-count aria-live="polite">—</span><span class="like-label">{{ copy.likes.label | escape }}</span>
  </button>
</div>
{% endif %}
