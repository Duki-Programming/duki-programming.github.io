{% assign likes_api = page.likes_api | default: site.data.likes.api_url | default: '' | strip %}
{% if likes_api != '' %}
<div class="download-likes" data-likes-product="{{ page.likes_product | default: 'market-peek' | escape }}" data-release-repository="{{ page.release_repository | default: 'Duki-Programming/Market-Peek-releases' | escape }}" data-likes-api="{{ likes_api | escape }}" data-likes-thanks="{{ copy.likes.thanks | escape }}" data-likes-error="{{ copy.likes.error | escape }}" data-likes-label="{{ copy.likes.action | escape }}" data-likes-done="{{ copy.likes.done | escape }}">
  <strong class="support-title">{{ copy.likes.title | escape }}</strong>
  <div class="support-summary">
    <button class="like-button" type="button" aria-label="{{ copy.likes.action | escape }}" data-supported="false" disabled>
      <span class="like-thumb" aria-hidden="true">👍</span><span data-likes-count aria-live="polite">—</span>
    </button>
  </div>
  <p class="support-status" data-likes-status role="status" aria-live="polite">{{ copy.likes.loading | escape }}</p>
</div>
{% endif %}
