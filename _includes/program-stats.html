{% if site.notifier_api_url and site.notifier_api_url != '' %}
<dl class="product-stats" data-program-stats="{{ page.product | escape }}" aria-label="{% if page.lang == 'en' %}App statistics{% else %}앱 통계{% endif %}">
  <div class="product-stat"><dt><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 4a3 3 0 0 1 0 6M18 13a5 5 0 0 1 3 5v2"/></svg>{% if page.lang == 'en' %}Visitors{% else %}방문자 수{% endif %}</dt><dd data-program-stat="visitors">—</dd></div>
  <div class="product-stat"><dt><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>{% if page.lang == 'en' %}Views{% else %}조회수{% endif %}</dt><dd data-program-stat="views">—</dd></div>
  <div class="product-stat"><dt><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>{% if page.lang == 'en' %}Total downloads{% else %}누적 다운로드{% endif %}</dt><dd data-program-stat="downloads">—</dd></div>
</dl>
{% endif %}
