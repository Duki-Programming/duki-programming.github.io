ko:
  title: |-
    혼자 쓰기엔
    조금 아까운 프로그램들!
  description: Duki Lab에서 만든 프로그램과 사용 방법을 소개합니다.
  section_title: 프로그램
  navigation: 언어 선택
  creator: 개발·제작
  programs:
    - id: btcoffice
      title: BTC Office
      description: "비트코인 전광판 아래, 나만의 캐릭터로 걷는 작은 픽셀 오피스. 설치 없이 브라우저에서 둘러보세요."
      platform: "브라우저 게임 · 공개 미리보기"
      icon: /assets/programs/btcoffice/icon.svg
      url: /btcoffice/
      featured: true
      banner_style: aurora-rainbow
      spotlight: "↗ PLAY NOW · 브라우저에서 출근하기"
    - id: "chatville"
      title: "ChatVille"
      description: "일곱 주민이 일하고 쉬며 오늘을 기억하는 AI 픽셀 마을. 카페와 강변을 걷고, 이웃에게 말을 걸어보세요."
      platform: "PC 게임 · 개발 중"
      icon: "/assets/programs/chatville/icon.svg"
      url: "/chatville/"
      featured: true

      spotlight: "✦ UPDATE · 강변 마을, 일곱 개의 하루"
    - id: market-peek
      title: Market Peek
      description: 코인과 한국·미국 주식 시세를 바탕화면 한편에서 확인하는 작은 위젯입니다.
      platform: Windows · macOS
      icon: /assets/programs/market-peek/icon.png
      url: /market-peek/
      featured: true
    - id: doro-modbus
      title: Doro Modbus
      description: Modbus RTU Master / Slave 시뮬레이터. CSV 주소 관리와 테스트 값 생성, 통신 그래프를 지원합니다.
      platform: Windows · 1.0.0
      icon: /assets/programs/doro-modbus/icon.png
      url: /doro-modbus/
      featured: false
    - id: bitbox
      title: BitBox · 비트박스
      description: 아이폰과 Apple Watch에서 Bitget 계좌·포지션을 한눈에 확인하는 앱. 현재 작업 중이며 다운로드는 준비 중입니다.
      platform: iPhone · Apple Watch · 작업 중
      icon: /assets/programs/bitbox/icon.png
      url: /bitbox/
      featured: false
    - id: talkey
      title: Talkey
      description: 손목에서 말하고 아이폰에 글자로. Apple Watch 음성 입력 앱 Talkey를 만들고 있습니다.
      platform: iPhone · Apple Watch · 작업 중
      icon: /assets/programs/talkey/icon.png
      url: /talkey/
      featured: false

en:
  title: |-
    Programs a little too good
    to keep to myself!
  description: Explore programs made by Duki Lab and learn how to use them.
  section_title: Programs
  navigation: Choose a language
  creator: Created by
  programs:
    - id: btcoffice
      title: BTC Office
      description: "A little pixel office beneath the Bitcoin ticker. Walk in with your own character and play in your browser."
      platform: "Browser game · Public preview"
      icon: /assets/programs/btcoffice/icon.svg
      url: /btcoffice/en/
      featured: true
      banner_style: aurora-rainbow
      spotlight: "↗ PLAY NOW · Your desk is waiting"
    - id: "chatville"
      title: "ChatVille"
      description: "An AI pixel village where seven neighbors work, rest, and remember. Explore the café and riverside, and say hello."
      platform: "PC game · In development"
      icon: "/assets/programs/chatville/icon.svg"
      url: "/chatville/en/"
      featured: true

      spotlight: "✦ UPDATE · A riverside village, seven lives"
    - id: market-peek
      title: Market Peek
      description: Follow crypto, Korean stocks, and US stocks from a small widget in the corner of your desktop.
      platform: Windows · macOS
      icon: /assets/programs/market-peek/icon.png
      url: /market-peek/en/
      featured: true
    - id: doro-modbus
      title: Doro Modbus
      description: Modbus RTU Master / Slave simulator with CSV address lists, value generators, and graphs.
      platform: Windows · 1.0.0
      icon: /assets/programs/doro-modbus/icon.png
      url: /doro-modbus/en/
      featured: false
    - id: bitbox
      title: BitBox
      description: Check Bitget balances and positions on iPhone and Apple Watch. In development; downloads are not available yet.
      platform: iPhone · Apple Watch · In development
      icon: /assets/programs/bitbox/icon.png
      url: /bitbox/en/
      featured: false

    - id: talkey
      title: Talkey
      description: Speak on your wrist, type on your iPhone. Talkey is a Korean voice-input companion in development.
      platform: iPhone · Apple Watch · In development
      icon: /assets/programs/talkey/icon.png
      url: /talkey/en/
      featured: false

ja:
  title: |-
    ひとりで使うには
    ちょっと惜しいプログラムたち。
  description: Duki Labが作ったアプリと、その使い方を紹介します。
  section_title: プログラム
  navigation: 言語を選択
  creator: 開発・制作
  programs:
  - id: btcoffice
    title: BTC Office
    description: "ビットコインの電光掲示板の下を歩く、小さなピクセルオフィス。インストールせずブラウザーで体験できます。"
    platform: "ブラウザーゲーム · 公開プレビュー"
    icon: /assets/programs/btcoffice/icon.svg
    url: /btcoffice/ja/
    featured: true
    banner_style: aurora-rainbow
    spotlight: "↗ PLAY NOW · あなたの席へ"
  - id: "chatville"
    title: "ChatVille"
    description: "7人の住民が働き、休み、今日を覚えていくAIピクセルの村。カフェや川辺を歩き、話しかけてみましょう。"
    platform: "PCゲーム · 開発中"
    icon: "/assets/programs/chatville/icon.svg"
    url: "/chatville/ja/"
    featured: true

    spotlight: "✦ UPDATE · 川辺の村、7人の暮らし"
  - id: market-peek
    title: Market Peek
    description: 暗号資産、韓国株、米国株の価格をデスクトップの片隅で確認できる、小さなウィジェットです。
    platform: Windows · macOS
    icon: "/assets/programs/market-peek/icon.png"
    url: "/market-peek/ja/"
    featured: true
  - id: doro-modbus
    title: Doro Modbus
    description: Modbus RTU Master / Slaveシミュレーター。CSVアドレス管理、テスト値の生成、通信グラフに対応しています。
    platform: Windows · 1.0.0
    icon: "/assets/programs/doro-modbus/icon.png"
    url: "/doro-modbus/ja/"
    featured: false
  - id: bitbox
    title: BitBox
    description: iPhoneとApple WatchでBitgetの残高とポジションを確認するアプリ。開発中のため、ダウンロードはまだ利用できません。
    platform: iPhone · Apple Watch · 開発中
    icon: "/assets/programs/bitbox/icon.png"
    url: "/bitbox/ja/"
    featured: false

  - id: talkey
    title: Talkey
    description: 手首で話して、iPhoneに文字を。韓国語の音声入力アプリTalkeyを開発中です。
    platform: iPhone · Apple Watch · 開発中
    icon: /assets/programs/talkey/icon.png
    url: /talkey/ja/
    featured: false
