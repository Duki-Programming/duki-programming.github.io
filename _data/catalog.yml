ko:
  title: |-
    혼자 쓰기엔
    조금 아까운 프로그램들!
  description: Duki Lab에서 만든 프로그램과 사용 방법을 소개합니다.
  section_title: 프로그램
  navigation: 언어 선택
  creator: 개발·제작
  programs:
    - id: market-peek
      title: Market Peek
      description: 코인과 한국·미국 주식 시세를 바탕화면 한편에서 확인하는 작은 위젯입니다.
      platform: Windows · macOS
      icon: /assets/programs/market-peek/icon.png
      url: /market-peek/
      featured: true
    - id: doro-modbus
      title: Doro Modbus
      description: Modbus RTU Master / Slave 시뮬레이터. CSV 주소 관리와 테스트 값 생성, 통신 그래프를 지원합니다.
      platform: Windows · Beta
      icon: /assets/programs/doro-modbus/icon.png
      url: /doro-modbus/
      featured: false
    - id: bitbox
      title: BitBox · 비트박스
      description: 아이폰과 Apple Watch에서 Bitget 계좌·포지션을 한눈에 확인하는 앱. 현재 작업 중이며 다운로드는 준비 중입니다.
      platform: iPhone · Apple Watch · 작업 중
      icon: /assets/programs/bitbox/icon.png
      url: /bitbox/
      featured: false
    - id: talkey
      title: Talkey
      description: 손목에서 말하고 아이폰에 글자로. Apple Watch 음성 입력 앱 Talkey를 만들고 있습니다.
      platform: iPhone · Apple Watch · 작업 중
      icon: /assets/programs/talkey/icon.png
      url: /talkey/
      featured: false

en:
  title: |-
    Programs a little too good
    to keep to myself!
  description: Explore programs made by Duki Lab and learn how to use them.
  section_title: Programs
  navigation: Choose a language
  creator: Created by
  programs:
    - id: market-peek
      title: Market Peek
      description: Follow crypto, Korean stocks, and US stocks from a small widget in the corner of your desktop.
      platform: Windows · macOS
      icon: /assets/programs/market-peek/icon.png
      url: /market-peek/en/
      featured: true
    - id: doro-modbus
      title: Doro Modbus
      description: Modbus RTU Master / Slave simulator with CSV address lists, value generators, and graphs.
      platform: Windows · Beta
      icon: /assets/programs/doro-modbus/icon.png
      url: /doro-modbus/en/
      featured: false
    - id: bitbox
      title: BitBox
      description: Check Bitget balances and positions on iPhone and Apple Watch. In development; downloads are not available yet.
      platform: iPhone · Apple Watch · In development
      icon: /assets/programs/bitbox/icon.png
      url: /bitbox/en/
      featured: false

    - id: talkey
      title: Talkey
      description: Speak on your wrist, type on your iPhone. Talkey is a Korean voice-input companion in development.
      platform: iPhone · Apple Watch · In development
      icon: /assets/programs/talkey/icon.png
      url: /talkey/en/
      featured: false

ja:
  title: |-
    ひとりで使うには
    ちょっと惜しいプログラムたち。
  description: Duki Labが作ったアプリと、その使い方を紹介します。
  section_title: プログラム
  navigation: 言語を選択
  creator: 開発・制作
  programs:
  - id: market-peek
    title: Market Peek
    description: 暗号資産、韓国株、米国株の価格をデスクトップの片隅で確認できる、小さなウィジェットです。
    platform: Windows · macOS
    icon: "/assets/programs/market-peek/icon.png"
    url: "/market-peek/ja/"
    featured: true
  - id: doro-modbus
    title: Doro Modbus
    description: Modbus RTU Master / Slaveシミュレーター。CSVアドレス管理、テスト値の生成、通信グラフに対応しています。
    platform: Windows · ベータ版
    icon: "/assets/programs/doro-modbus/icon.png"
    url: "/doro-modbus/ja/"
    featured: false
  - id: bitbox
    title: BitBox
    description: iPhoneとApple WatchでBitgetの残高とポジションを確認するアプリ。開発中のため、ダウンロードはまだ利用できません。
    platform: iPhone · Apple Watch · 開発中
    icon: "/assets/programs/bitbox/icon.png"
    url: "/bitbox/ja/"
    featured: false

  - id: talkey
    title: Talkey
    description: 手首で話して、iPhoneに文字を。韓国語の音声入力アプリTalkeyを開発中です。
    platform: iPhone · Apple Watch · 開発中
    icon: /assets/programs/talkey/icon.png
    url: /talkey/ja/
    featured: false
