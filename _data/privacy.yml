        "title": "Retention and deletion",
        "paragraphs": [
          "Statistics and deduplication records are retained until the statistics service ends. We delete records from the operating database earlier when their purpose ends or applicable law requires deletion. Inquiry messages are deleted when no longer needed after handling the inquiry, subject to any legal retention requirements."
