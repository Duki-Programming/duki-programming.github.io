  mac_detail: Universal DMG installer
  mac_pending: macOS download coming soon
  mac_pending_detail: The macOS installer for the latest version is being prepared.
  install_title: Three steps to get started.
  install_steps:
    - title: Download your file
      body: Choose the EXE installer or 7z archive for Windows, or the Universal DMG for Mac.
    - title: Install the app
      body: On Windows, follow the installer’s Korean-language prompts, or extract the 7z archive and run the app. On Mac, open the DMG and drag Market Peek into Applications.
    - title: Pick a market to follow
      body: Click the symbol name to search for an instrument. Click the price to expand its chart.
  faq:
    - question: Is the app available in English?
      answer: The latest macOS app supports Korean and English in Settings → Language. The Windows installer’s prompts are in Korean. Changing the website language does not change the app language.
    - question: Do I need to install Python?
      answer: No. The Windows and macOS downloads include the environment needed to run the app.
    - question: How do Mac updates work?
      answer: Mac 1.0.4 includes an updater inside the app. Choose Update to download, verify, replace the app, and restart. If you have 1.0.2 or 1.0.3, install the latest DMG once to get the updater for future releases.
    - question: How do I connect an exchange account?
      answer: Add each exchange’s API credentials in the app settings. If you choose to save them, the key, secret, and any required passphrase are encrypted and stored separately for each exchange on this computer.
    - question: Can I hide small spot balances?
      answer: In Settings → Display & window, adjust the minimum spot value. By default, spot holdings worth 1 USDT or less are hidden. Set it to 0 to show all holdings. Futures and spot holdings without a known value remain visible.
    - question: What is the difference between Minimize and Close or Hide?
      answer: The − button minimizes to the taskbar. Close, Hide, and Alt+H hide the window in the tray. Use the tray icon or Alt+H to bring it back. To quit completely, use the tray menu or Quit in settings. If the tray is unavailable, the app minimizes instead.
    - question: Why can’t I see prices on the taskbar?
      answer: Enable taskbar prices in the app’s Settings → Display & window. In Windows Settings → Personalization → Taskbar, set the option for combining buttons and hiding labels to Never. The exact setting name varies by Windows version. Prices appear on one line and may be clipped if space is limited.
    - question: How are TP and SL values displayed?
      answer: Position labels and related tooltips use one decimal place. Nonzero values below 0.1 appear as <0.1. This only simplifies the display; order price and quantity precision are preserved.
    - question: Why does Windows show a security notice?
      answer: The current installer is an unsigned, independently developed build. Windows may display a notice that the publisher cannot be verified. Check the download source and file before deciding whether to install it.
    - question: Can I use Market Peek on Mac or a phone?
      answer: The Universal DMG supports Apple Silicon and Intel Macs. Taskbar prices and launch at login are Windows-only features. You can visit this download page on a phone, but the app is for desktop computers.
    - question: Why does my Mac say the developer cannot be verified?
      answer: The current macOS build is not signed with an Apple Developer ID or notarized. After verifying the source and file, try opening the app once, then check System Settings → Privacy & Security for the option to open the blocked app.
  creator: Created by

