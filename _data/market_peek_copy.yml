  install_steps:
  - title: ファイルをダウンロード
    body: WindowsではEXEインストーラーか7zアーカイブを、MacではUniversal DMGを選びます。
  - title: アプリをインストール
    body: Windowsでは韓国語の案内に従ってインストールするか、7zを展開して実行します。MacではDMGを開き、Market Peekをアプリケーションフォルダへドラッグします。
  - title: 追いかける銘柄を選ぶ
    body: 銘柄名をクリックして検索します。価格をクリックするとチャートが開きます。
  faq:
  - question: アプリで選べる言語は？
    answer: 最新のmacOS版は、設定 → 言語で韓国語と英語を選べます。Windowsインストーラーの案内は韓国語です。サイトの言語切り替えはアプリの言語設定には影響しません。
  - question: Pythonのインストールは必要ですか？
    answer: 不要です。Windows版とmacOS版には実行に必要な環境が含まれています。
  - question: Mac版の更新方法は？
    answer: Mac版1.0.4にはアプリ内更新機能があります。「更新」を選ぶと、ダウンロード・検証・置き換え・再起動を行います。1.0.2または1.0.3の場合は、最新のDMGを一度インストールすると以後の更新機能を利用できます。
  - question: 取引所アカウントの接続方法は？
    answer: アプリの設定で各取引所のAPI認証情報を追加します。保存を選ぶと、キー・シークレット・必要なパスフレーズを暗号化し、このコンピューター内に取引所ごとに保存します。
  - question: 少額の現物残高を非表示にできますか？
    answer: 設定 → 表示とウィンドウで、現物の最低表示額を変更できます。初期設定では1 USDT以下を非表示にします。0にするとすべて表示します。先物と評価額が不明な現物は表示されます。
  - question: 最小化と、閉じる・非表示の違いは？
    answer: "−ボタンはタスクバーへ最小化します。閉じる・非表示・Alt+Hはウィンドウをトレイに収納します。トレイアイコンかAlt+Hで再表示できます。完全に終了するにはトレイメニューか設定の終了を使います。トレイを利用できない場合は最小化します。"
  - question: タスクバーに価格が表示されません。
    answer: アプリの設定 → 表示とウィンドウで価格表示を有効にします。Windowsの設定 → 個人用設定 → タスクバーで、ボタンの結合とラベル非表示の設定を「なし」にします。名称はWindowsのバージョンによって異なります。価格は1行表示のため、幅が足りないと一部が省略されることがあります。
  - question: TP・SLはどのように表示されますか？
    answer: ポジションのラベルと関連ツールチップは小数第1位まで表示します。0より大きく0.1未満の値は<0.1と表示します。これは表示のみの簡略化で、注文価格や数量の精度は維持されます。
  - question: Windowsでセキュリティ通知が出るのはなぜですか？
    answer: 現在のインストーラーは個人開発の署名なしビルドです。発行元を確認できないという通知が出る場合があります。配布元とファイルを確認してからインストールを判断してください。
  - question: Macやスマートフォンで使えますか？
    answer: Universal DMGはApple SiliconとIntel Macに対応しています。タスクバーの価格表示とログイン時起動はWindows専用です。スマートフォンでこのページを閲覧できますが、アプリはデスクトップ用です。
  - question: Macで開発元を確認できないと表示されます。
    answer: 現在のmacOS版はApple Developer IDによる署名と公証を行っていません。配布元とファイルを確認したうえで一度起動を試し、システム設定
      → プライバシーとセキュリティでブロックされたアプリを開く項目を確認してください。
