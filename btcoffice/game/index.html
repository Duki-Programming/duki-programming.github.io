/* Keep the game canvas stationary throughout soft-keyboard animations.
 * The keyboard overlays the game; chat and other UI keep their positions. */

  function mount() {
    const canvas = document.getElementById('canvas');
    if (!canvas) return;

    let releasing = false;
    let releaseTimer;

        owners.add(owner);
        if (!locked) locked = { width: innerWidth, height: innerHeight };
        releasing = false;
        clearTimeout(releaseTimer);
        sync();

      release(owner = 'default') {
        owners.delete(owner);
        if (owners.size || !locked) return;
        releasing = true;
        settleRelease();

      get locked() { return !!locked; },
      get size() { return { width: canvas.width, height: canvas.height }; }

    function settleRelease() {
      clearTimeout(releaseTimer);

      // that partial height. Keep the original size through the entire cycle.
      releaseTimer = setTimeout(() => {
        const editing = document.activeElement?.matches?.('input,textarea,[contenteditable="true"]');
        if (releasing && locked && !owners.size && !editing &&
            innerHeight >= locked.height - 1 && visibleHeight() >= locked.height - 1 &&
            Math.abs(visual?.offsetTop || 0) <= 1 &&
            !(keyboard?.boundingRect?.height > 0)) {

          releasing = false;

    function sync() {
      if (locked && Math.abs(innerWidth - locked.width) > 2) {
        locked = owners.size ? { width: innerWidth, height: innerHeight } : null;
        if (!locked) releasing = false;
      }
      const width = locked ? locked.width : innerWidth;
      const height = locked ? locked.height : innerHeight;

      if (releasing) settleRelease();
