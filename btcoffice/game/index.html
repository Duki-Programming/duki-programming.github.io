	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;

			}

			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);

				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}

		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());

/* Keep the game canvas stationary throughout soft-keyboard animations.
 * The keyboard overlays the game; chat and other UI keep their positions. */
(() => {
  function mount() {
    const canvas = document.getElementById('canvas');
    if (!canvas) return;
    let locked = null;
    let releasing = false;
    let releaseTimer;
    const visual = window.visualViewport;
    const keyboard = navigator.virtualKeyboard;
    // Supported Android browsers can overlay the keyboard without resizing or
    // scrolling the page. Other browsers use the same locked canvas fallback.
    if (keyboard) keyboard.overlaysContent = true;

      const height = visual ? visual.height : innerHeight;
      const rect = keyboard?.boundingRect;
      return rect?.height > 0 ? Math.min(height, rect.top) : height;
    }

      lock() {

        releasing = false;
        clearTimeout(releaseTimer);
        sync();

      release() {
        releasing = true;
        settleRelease();
      },
      get locked() { return !!locked; },
      get size() { return { width: canvas.width, height: canvas.height }; }
    };
    function settleRelease() {
      clearTimeout(releaseTimer);
      // Wait for the animation to finish. Releasing while still 48px short
      // caused the engine to resize twice and visibly reframe the whole map.
      releaseTimer = setTimeout(() => {
        if (releasing && locked && visibleHeight() >= locked.height * 0.85 &&
            !(keyboard?.boundingRect?.height > 0)) {
          locked = null;
          releasing = false;
          sync();
        }
      }, 350);
    }
    function sync() {
      if (locked && Math.abs(innerWidth - locked.width) > 2) locked = null;
      const width = locked ? locked.width : innerWidth;
      const height = locked ? locked.height : innerHeight;
      const scale = window.devicePixelRatio || 1;
      const pixelsX = Math.max(1, Math.round(width * scale));
      const pixelsY = Math.max(1, Math.round(height * scale));
      if (canvas.width !== pixelsX) canvas.width = pixelsX;
      if (canvas.height !== pixelsY) canvas.height = pixelsY;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      // Do not translate the entire rendered map in response to keyboard pan.
      if (releasing) settleRelease();
    }
    Object.assign(canvas.style, { position: 'fixed', left: '0', top: '0', transform: 'none' });
    Object.assign(document.documentElement.style, { overflow: 'hidden', overscrollBehavior: 'none' });
    Object.assign(document.body.style, { position: 'fixed', inset: '0', overflow: 'hidden', overscrollBehavior: 'none' });
    window.btcGameViewport = viewport;
    window.addEventListener('resize', sync);
    window.addEventListener('scroll', () => {
      if (locked && (scrollX || scrollY)) window.scrollTo(0, 0);
    });
    visual?.addEventListener('resize', sync);
    keyboard?.addEventListener('geometrychange', sync);
    sync();
  }
