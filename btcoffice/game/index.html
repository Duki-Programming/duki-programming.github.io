	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}

			statusOverlay.remove();
			initializing = false;

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));

	function displayFailureNotice(err) {
		console.error(err);

/* Keep the game canvas stationary throughout soft-keyboard animations.
 * The keyboard overlays the game; chat and other UI keep their positions. */
(() => {
  function mount() {
    const canvas = document.getElementById('canvas');
    if (!canvas) return;
    let locked = null;
    let releasing = false;
    let releaseTimer;
    const owners = new Set();
    const visual = window.visualViewport;
    const keyboard = navigator.virtualKeyboard;
    // Supported Android browsers can overlay the keyboard without resizing or
    // scrolling the page. Other browsers use the same locked canvas fallback.
    if (keyboard) keyboard.overlaysContent = true;
    function visibleHeight() {
      const height = visual ? visual.height : innerHeight;
      const rect = keyboard?.boundingRect;
      return rect?.height > 0 ? Math.min(height, rect.top) : height;
    }
    const viewport = {
      lock(owner = 'default') {
        owners.add(owner);
        if (!locked) locked = { width: innerWidth, height: innerHeight };
        releasing = false;
        clearTimeout(releaseTimer);
        sync();
      },
      release(owner = 'default') {
        owners.delete(owner);
        if (owners.size || !locked) return;
        releasing = true;
        settleRelease();
      },
      get locked() { return !!locked; },
      get size() { return { width: canvas.width, height: canvas.height }; }
    };
    function settleRelease() {
      clearTimeout(releaseTimer);
      // iOS can pause near the end of keyboard dismissal, then reopen from
      // that partial height. Keep the original size through the entire cycle.
      releaseTimer = setTimeout(() => {
        const editing = document.activeElement?.matches?.('input,textarea,[contenteditable="true"]');
        if (releasing && locked && !owners.size && !editing &&
            innerHeight >= locked.height - 1 && visibleHeight() >= locked.height - 1 &&
            Math.abs(visual?.offsetTop || 0) <= 1 &&
            !(keyboard?.boundingRect?.height > 0)) {
          locked = null;
          releasing = false;
          sync();
        }
      }, 350);
    }
    function sync() {
      if (locked && Math.abs(innerWidth - locked.width) > 2) {
        locked = owners.size ? { width: innerWidth, height: innerHeight } : null;
        if (!locked) releasing = false;
      }
      const width = locked ? locked.width : innerWidth;
      const height = locked ? locked.height : innerHeight;
      const scale = window.devicePixelRatio || 1;
      const pixelsX = Math.max(1, Math.round(width * scale));
      const pixelsY = Math.max(1, Math.round(height * scale));
      if (canvas.width !== pixelsX) canvas.width = pixelsX;
      if (canvas.height !== pixelsY) canvas.height = pixelsY;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      // The document itself must not shrink behind the fixed canvas on iOS.
      document.documentElement.style.height = height + 'px';
      document.body.style.width = width + 'px';
      document.body.style.height = height + 'px';

      // Do not translate the entire rendered map in response to keyboard pan.
      if (releasing) settleRelease();

    function pinScroll() {
      if (locked && (scrollX || scrollY)) window.scrollTo(0, 0);
    }

    Object.assign(document.documentElement.style, { overflow: 'hidden', overscrollBehavior: 'none' });

    window.btcGameViewport = viewport;
    window.addEventListener('resize', sync);
    window.addEventListener('scroll', pinScroll);
    visual?.addEventListener('resize', sync);
    visual?.addEventListener('scroll', sync);
    keyboard?.addEventListener('geometrychange', sync);
    sync();

(function () {
  if (window.btcStreetClock) return;

  let formatter, serverTime = null, acceptedAt = 0;
  const format = value => new Intl.DateTimeFormat('en-GB', {timeZone: value, hour: '2-digit', hourCycle: 'h23'});

    configure(context) {

    }
    held.add(event.code);

  window.addEventListener('blur',()=>focus(false));
  window.addEventListener('focus',()=>focus(!document.hidden));
  window.addEventListener('pagehide',()=>focus(false));
  window.addEventListener('pageshow',()=>focus(!document.hidden&&document.hasFocus()));
  document.addEventListener('visibilitychange',()=>focus(!document.hidden&&document.hasFocus()));
  window.btcGameInput=bridge;
})();
