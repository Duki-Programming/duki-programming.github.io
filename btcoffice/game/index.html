(function () {
  if (window.btcStreetClock) return;
  let zone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  let formatter, serverTime = null, acceptedAt = 0;
  const countries = window.btcTimeZoneCountries || {};
  let timestampFormat;
  const format = value => new Intl.DateTimeFormat('en-GB', {timeZone: value, hour: '2-digit', hourCycle: 'h23'});
  formatter = format(zone);
  window.btcStreetClock = {
    configure(context) {
      if (!context || typeof context !== 'object') return;
      if (typeof context.time_zone === 'string') {
        try { const next = format(context.time_zone); formatter = next; zone = context.time_zone; timestampFormat = null; } catch { /* Use the device zone when GeoIP is unavailable. */ }
      }
      if (Number.isFinite(context.server_time) && context.server_time > 0) {
        serverTime = context.server_time; acceptedAt = Date.now();
      }
    },
    now() { return serverTime === null ? Date.now() : serverTime + Date.now() - acceptedAt; },
    isDay(at) {
      const hour = Number(formatter.format(new Date(at ?? this.now())));
      return hour >= 6 && hour < 18;
    },
    stamp(at) {
      const value = Number(at);
      if (!Number.isFinite(value) || value <= 0 || value > 8.64e15) return '기준: 아직 수신 전';
      timestampFormat ||= new Intl.DateTimeFormat('en-GB', {timeZone: zone, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
      const parts = Object.fromEntries(timestampFormat.formatToParts(new Date(value)).map(p => [p.type, p.value]));
      const country = countries[zone] || countries[timestampFormat.resolvedOptions().timeZone] || zone;
      return `기준: ${parts.year}.${parts.month}.${parts.day} ${parts.hour}:${parts.minute}:${parts.second} (${country})`;
    },
    get timeZone() { return zone; }
  };
})();

// The persistent canvas needs focus cleanup in every room, including rooms
// without the cinema's DOM keyboard router. A missing OS keyup must not move it.
(() => {
  const keys=new Map(Object.entries({KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',ShiftLeft:'Shift',ShiftRight:'Shift',KeyE:'e',KeyP:'p',KeyR:'r'}));
  const held=new Set();
  const bridge={callback:null,focused:!document.hidden&&document.hasFocus()};
  const editing=target=>target?.isContentEditable||/^(INPUT|TEXTAREA)$/.test(target?.tagName||'');
  function release(){
    held.clear();
    const canvas=document.getElementById('canvas');
    for(const [code,key] of keys)canvas?.dispatchEvent(new KeyboardEvent('keyup',{code,key,bubbles:true,cancelable:true}));
  }
  function focus(value){bridge.focused=value;release();bridge.callback?.(value);}
  // Godot prevents the default for canvas key events. Stop browser shortcuts
  // before they reach that listener, without cancelling the browser's action.
  const browserKey=event=>event.ctrlKey||event.metaKey||event.altKey||/^(Control|Meta|Alt)(Left|Right)$/.test(event.code)||['F1','F3','F5','F6','F7','F10','F11','F12'].includes(event.code);
  const zoomKeys=new Map([['Equal',1],['NumpadAdd',1],['Minus',-1],['NumpadSubtract',-1],['Digit0',0],['Numpad0',0]]);
  for(const type of ['keydown','keyup'])window.addEventListener(type,event=>{
    const camera=window.btcCamera;
    if((event.ctrlKey||event.metaKey)&&!event.altKey&&!event.isComposing&&zoomKeys.has(event.code)&&camera?.active&&typeof camera.zoom==='function'){
      event.preventDefault();event.stopImmediatePropagation();
      if(type==='keydown'){
        release();window.BTCCinema?.keyboard?.release();
        const step=zoomKeys.get(event.code);camera.zoom(step,0.5,0.5,step===0?'reset':'key');
      }
      return;
    }
    if(event.target!==document.getElementById('canvas')||!browserKey(event))return;
    if(type==='keydown'){
      release();window.BTCCinema?.keyboard?.release();bridge.callback?.(bridge.focused);
    }
    event.stopImmediatePropagation();
  },true);
  document.addEventListener('keydown',event=>{
    if(browserKey(event)||!keys.has(event.code)||editing(event.target))return;
    if(!bridge.focused||document.hidden||event.repeat&&!held.has(event.code)){
      event.preventDefault();event.stopImmediatePropagation();return;
    }
    held.add(event.code);
  },true);
  document.addEventListener('keyup',event=>held.delete(event.code),true);
  window.addEventListener('blur',()=>focus(false));
  window.addEventListener('focus',()=>focus(!document.hidden));
  window.addEventListener('pagehide',()=>focus(false));
  window.addEventListener('pageshow',()=>focus(!document.hidden&&document.hasFocus()));
  document.addEventListener('visibilitychange',()=>focus(!document.hidden&&document.hasFocus()));
  window.btcGameInput=bridge;
})();

<script>
// The car drives in with the download and holds the middle of the screen while
// the street scrolls past, reaching seven tenths of the way across by 99%.
// There the street stops and the car shoots off to the right within a second;
// once the engine is up the ride fades straight into the title screen.
(function () {
	const bar = document.getElementById('status-progress'), ride = document.getElementById('ride');
	const taxi = document.getElementById('ride-taxi'), city = document.getElementById('ride-city'), road = document.getElementById('ride-road');
	const line = document.getElementById('ride-line'), percent = document.getElementById('ride-percent');
	// Outside the engine's status box, so the ride outlives it for the exit.
	document.body.appendChild(ride);
	const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
	// Tile widths come from the pictures' proportions at their drawn height.
	const ratios = { city: 0, road: 0 };
	const measure = (name, url) => { const image = new Image(); image.onload = () => { ratios[name] = image.width / image.height; }; image.src = url; };
	measure('city', 'app-game-20261120-chart115b/loading-city.png'); measure('road', 'app-game-20261120-chart115b/loading-road.png');
	// A different ride each visit: the cab, or a tinted car in two layers.
	const rides = [['taxi'], ['taxi'], ['sedan', 'c8ccd4', '8a2a2a', '2c4a86', '3f6b4d', 'a8632c'], ['luxury', '16181f', 'd9dce2', '1d2a4d', '5a1620'],
		['coupe', 'e02622', 'f7c928', 'ff7a1a', '2f6fe0', '7ad63c'], ['wedge', 'e02622', 'f7c928', '9a34c8', 'f2f2f4', '18c7c2']];
	const choice = rides[Math.floor(Math.random() * rides.length)], pen = document.getElementById('ride-car').getContext('2d');
	const picture = name => new Promise(done => { const image = new Image(); image.onload = () => done(image); image.src = 'app-game-20261120-chart115b/loading-' + name + '.png'; });
	if (choice.length === 1) picture('taxi').then(image => pen.drawImage(image, 0, 0));
	else Promise.all([picture(choice[0] + '-paint'), picture(choice[0] + '-trim')]).then(([paint, trim]) => {
		pen.drawImage(paint, 0, 0);
		pen.globalCompositeOperation = 'multiply';
		pen.fillStyle = '#' + choice[1 + Math.floor(Math.random() * (choice.length - 1))];
		pen.fillRect(0, 0, 228, 100);
		pen.globalCompositeOperation = 'destination-in';
		pen.drawImage(paint, 0, 0);
		pen.globalCompositeOperation = 'source-over';
		pen.drawImage(trim, 0, 0);
	});
	let shown = 0, x = null, last = 0, street = 1, cityX = 0, roadX = 0, phase = 'drive', began = 0;
	const WHOOSH = 1.0;
	function scroll(element, offset, ratio) {
		const tile = element.offsetHeight * ratio;
		if (tile > 0) element.style.backgroundPositionX = -Math.round(offset % tile) + 'px';
	}
	function step(now) {
		const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
		last = now;
		const loading = !!document.getElementById('status');
		const part = loading && bar.max > 0 && bar.hasAttribute('max') ? Math.min(1, bar.value / bar.max) : (loading ? shown : 1);
		shown = Math.max(shown, part);
		const width = taxi.offsetWidth, vh = window.innerHeight / 100;
		// Until 99% the car drives up to seven tenths of the way across; at 99% it
		// shoots off to the right in one go, without waiting for the last percent.
		const start = -width * 0.3, far = window.innerWidth * 0.7 - width / 2;
		if (x === null) x = start;
		if (phase === 'drive') {
			const target = start + (far - start) * Math.min(1, shown / 0.99);
			x += (target - x) * Math.min(1, dt * 4);
			if (shown >= 0.99) {
				// The engine's start-up freezes the page's script for a few seconds,
				// so the dash is a CSS transition the compositor finishes on its own.
				phase = 'exit';
				began = now;
				street = 0;
				ride.classList.add('whoosh');
				line.textContent = '도착! 문을 여는 중...';
				taxi.style.transform = 'translateX(' + Math.round(x) + 'px) scaleX(1)';
				void taxi.offsetWidth;
				taxi.style.transition = 'transform ' + WHOOSH + 's cubic-bezier(.6, 0, .9, .35)';
				taxi.style.transform = 'translateX(' + Math.round(window.innerWidth + width * 0.5) + 'px) scaleX(1.18)';
			}
		} else if (phase === 'exit' && now - began >= WHOOSH * 1000) {
			phase = 'away';
			ride.classList.remove('whoosh');
		}
		// Once the car is gone and the engine is up, fade into the title screen.
		if (phase === 'away' && !loading) {
			ride.classList.add('gone');
			setTimeout(() => ride.remove(), 300);
			return;
		}
		if (phase === 'drive') taxi.style.transform = 'translateX(' + Math.round(x) + 'px) scaleX(1)';
		if (!still) {
			cityX += 10 * vh * dt * street;
			roadX += 80 * vh * dt * street;
		}
		scroll(city, cityX, ratios.city);
		scroll(road, roadX, ratios.road);
		const shownPercent = shown > 0 ? String(Math.round(shown * 100)) : '';
		if (percent.dataset.value !== shownPercent) {
			percent.dataset.value = shownPercent;
			percent.innerHTML = shownPercent ? shownPercent + '<i>%</i>' : '';
		}
		requestAnimationFrame(step);
	}
	requestAnimationFrame(step);
})();
</script>
